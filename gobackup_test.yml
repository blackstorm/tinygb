# gobackup config example
# -----------------------
# Put this file in follow place:
# ~/.gobackup/gobackup.yml or /etc/gobackup/gobackup.yml
web:
  username: gobackup
  password: 123456
models:
  base_test:
    description: "This is base test."
    schedule:
      # At 04:05 on Sunday.
      cron: "5 4 * * sun"
    compress_with:
      filename_format: "2006.01.01.15.00.00"
      type: tgz
    encrypt_with:
      type: openssl
      password: 123456
      salt: false
      openssl: true
    default_storage: s3
    storages:
      s3:
        type: s3
        keep: 20
        bucket: gobackup-test
        region: ap-southeast-1
        path: backups
        access_key_id: xxxxxxxx
        secret_access_key: xxxxxxxxxxxx
    databases:
      postgresql:
        type: postgresql
        host: localhost
    archive:
      includes:
        - /home/ubuntu/.ssh/
        - /etc/nginx/nginx.conf
        - /etc/redis/redis.conf
        - /etc/logrotate.d/
      excludes:
        - /home/ubuntu/.ssh/known_hosts
        - /etc/logrotate.d/syslog
  normal_files:
    schedule:
      every: "1day"
      at: "0:30"
    storages:
      s3:
        type: s3
        bucket: gobackup-test
    archive:
      includes:
        - /etc/hosts
  test_model:
    compress_with:
      type: tgz
    storages:
      s3:
        type: s3
        bucket: gobackup-test
    archive:
      includes:
        - /etc/hosts
  expand_env:
    databases:
      postgresql:
        type: postgresql
        database: demo
    archive:
      includes:
        - /etc/hosts
    storages:
      s3:
        type: s3
        bucket: gobackup-test
        region: ap-southeast-1
        path: backups
        access_key_id: $S3_ACCESS_KEY_ID
        secret_access_key: ${S3_SECRET_ACCESS_KEY}
  demo:
    schedule:
      every: "30s"
    compress_with:
      type: tgz
    encrypt_with:
      type: openssl
      password: 123456
    notifiers:
    before_script: |
      echo before_script invoked.
      ls -lh | wc -l
      echo This is before_script second line.
    after_script: |
      echo after_script invoked.
      ls -lh | wc -l
      echo This is after_script second line.
    storages:
      s3:
        type: s3
        keep: 10
        bucket: test
    archive:
      includes:
        - /etc/hosts
      excludes:
        - /home/ubuntu/.ssh/known_hosts
        - /etc/logrotate.d/syslog
